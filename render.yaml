# Render Blueprint — one web service + a managed PostgreSQL database.
# Deploy: Render Dashboard → New → Blueprint → pick this repository.
services:
  - type: web
    name: tsue-clubs
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tsue-clubs-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: ALLOW_DEMO_LOGIN
        value: "0"

databases:
  - name: tsue-clubs-db
    plan: basic-256mb
    region: frankfurt
    databaseName: tsue_clubs
    user: tsue
